<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="ad.size" content="width=320,height=480">
    <title>FlappyJet - Tap to Play!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        #startScreen, #endScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
        }

        #startScreen h1 {
            font-size: 48px;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        #startScreen p {
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            animation: pulse 1.5s infinite;
        }

        #endScreen {
            display: none;
        }

        #endScreen h2 {
            font-size: 36px;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 10px;
        }

        #endScreen .score {
            font-size: 48px;
            color: #FFD700;
            text-shadow: 3px 3px 0 #000;
            margin: 20px 0;
        }

        #installBtn {
            background: linear-gradient(180deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #2d6b2f;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
            text-transform: uppercase;
        }

        #installBtn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2d6b2f;
        }

        #scoreDisplay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            color: white;
            text-shadow: 3px 3px 0 #000;
            z-index: 5;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            from { transform: translateX(-100px); }
            to { transform: translateX(calc(100vw + 100px)); }
        }
    </style>
</head>
<body>
    <!-- Decorative clouds -->
    <div class="cloud" style="width: 80px; height: 40px; top: 10%; left: -100px; animation-delay: 0s;"></div>
    <div class="cloud" style="width: 100px; height: 50px; top: 30%; left: -100px; animation-delay: 7s;"></div>
    <div class="cloud" style="width: 60px; height: 30px; top: 50%; left: -100px; animation-delay: 14s;"></div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="scoreDisplay">0</div>

    <div id="startScreen">
        <h1>🛩️ FLAPPY JET</h1>
        <p>TAP TO FLY!</p>
    </div>

    <div id="endScreen">
        <h2>AWESOME!</h2>
        <div class="score">Score: <span id="finalScore">0</span></div>
        <p style="font-size: 20px; margin-bottom: 10px;">Want more jets & themes?</p>
        <button id="installBtn">INSTALL NOW</button>
    </div>

    <script>
        // MRAID Integration
        let mraidReady = false;
        
        if (typeof mraid !== 'undefined') {
            if (mraid.getState() === 'loading') {
                mraid.addEventListener('ready', function() {
                    mraidReady = true;
                    console.log('MRAID ready');
                });
            } else {
                mraidReady = true;
            }
        }

        // Game Configuration
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const endScreen = document.getElementById('endScreen');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const installBtn = document.getElementById('installBtn');

        // Resize canvas to fill screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game State
        let gameStarted = false;
        let gameOver = false;
        let score = 0;
        let frameCount = 0;

        // Jet
        const jet = {
            x: canvas.width * 0.2,
            y: canvas.height / 2,
            width: 40,
            height: 30,
            velocity: 0,
            gravity: 0.5,
            jumpStrength: -10,
            rotation: 0
        };

        // Obstacles
        const obstacles = [];
        const obstacleWidth = 60;
        const obstacleGap = 180;
        const obstacleSpeed = 3;

        // Create obstacle
        function createObstacle() {
            const minHeight = 50;
            const maxHeight = canvas.height - obstacleGap - minHeight;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            obstacles.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + obstacleGap,
                passed: false
            });
        }

        // Draw jet
        function drawJet() {
            ctx.save();
            ctx.translate(jet.x + jet.width/2, jet.y + jet.height/2);
            ctx.rotate(jet.rotation);
            
            // Jet body (simplified)
            ctx.fillStyle = '#4A90E2';
            ctx.fillRect(-jet.width/2, -jet.height/2, jet.width, jet.height);
            
            // Jet nose
            ctx.fillStyle = '#2E5C8A';
            ctx.beginPath();
            ctx.moveTo(jet.width/2, 0);
            ctx.lineTo(jet.width/2 + 10, 0);
            ctx.lineTo(jet.width/2, -5);
            ctx.closePath();
            ctx.fill();
            
            // Wing
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(-5, jet.height/2, 20, 8);
            
            ctx.restore();
        }

        // Draw obstacles
        function drawObstacles() {
            ctx.fillStyle = '#2ECC71';
            ctx.strokeStyle = '#27AE60';
            ctx.lineWidth = 3;
            
            obstacles.forEach(obs => {
                // Top obstacle
                ctx.fillRect(obs.x, 0, obstacleWidth, obs.topHeight);
                ctx.strokeRect(obs.x, 0, obstacleWidth, obs.topHeight);
                
                // Bottom obstacle
                ctx.fillRect(obs.x, obs.bottomY, obstacleWidth, canvas.height - obs.bottomY);
                ctx.strokeRect(obs.x, obs.bottomY, obstacleWidth, canvas.height - obs.bottomY);
            });
        }

        // Update game
        function update() {
            if (!gameStarted || gameOver) return;

            frameCount++;

            // Update jet
            jet.velocity += jet.gravity;
            jet.y += jet.velocity;
            jet.rotation = Math.min(Math.max(jet.velocity * 0.05, -0.5), 0.5);

            // Create obstacles
            if (frameCount % 90 === 0) {
                createObstacle();
            }

            // Update obstacles
            obstacles.forEach((obs, index) => {
                obs.x -= obstacleSpeed;

                // Score when passing obstacle
                if (!obs.passed && obs.x + obstacleWidth < jet.x) {
                    obs.passed = true;
                    score++;
                    scoreDisplay.textContent = score;
                }

                // Remove off-screen obstacles
                if (obs.x + obstacleWidth < 0) {
                    obstacles.splice(index, 1);
                }

                // Collision detection
                if (
                    jet.x + jet.width > obs.x &&
                    jet.x < obs.x + obstacleWidth &&
                    (jet.y < obs.topHeight || jet.y + jet.height > obs.bottomY)
                ) {
                    endGame();
                }
            });

            // Ground/ceiling collision
            if (jet.y + jet.height > canvas.height || jet.y < 0) {
                endGame();
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw game elements
            drawObstacles();
            drawJet();
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        function startGame() {
            gameStarted = true;
            startScreen.style.display = 'none';
            scoreDisplay.style.display = 'block';
            jet.velocity = jet.jumpStrength;
        }

        // End game
        function endGame() {
            if (gameOver) return;
            gameOver = true;
            
            document.getElementById('finalScore').textContent = score;
            endScreen.style.display = 'flex';
            
            // Auto-show CTA after 1 second
            setTimeout(() => {
                installBtn.style.animation = 'pulse 0.8s infinite';
            }, 1000);
        }

        // Jump
        function jump() {
            if (!gameStarted) {
                startGame();
            } else if (!gameOver) {
                jet.velocity = jet.jumpStrength;
            }
        }

        // Event listeners
        document.body.addEventListener('click', jump);
        document.body.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });

        // Install button click
        installBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent jump trigger
            if (typeof mraid !== 'undefined' && mraidReady) {
                // MRAID open for app store
                mraid.open('https://play.google.com/store/apps/details?id=com.flappyjet.pro.flappy_jet_pro');
            } else {
                // Fallback for testing
                window.open('https://play.google.com/store/apps/details?id=com.flappyjet.pro.flappy_jet_pro', '_blank');
            }
        });

        // Start game loop
        gameLoop();

        // MRAID viewability handling
        if (typeof mraid !== 'undefined') {
            mraid.addEventListener('viewableChange', function(viewable) {
                if (!viewable && gameStarted && !gameOver) {
                    // Pause game when not viewable
                    gameStarted = false;
                }
            });
        }
    </script>
</body>
</html>
