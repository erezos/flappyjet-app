<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="ad.size" content="width=320,height=480">
    <title>FlappyJet - Collect Jets!</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{width:100%;height:100vh;overflow:hidden;font-family:'Arial Black',sans-serif;background:linear-gradient(180deg,#ff6b35 0%,#f7931e 50%,#ffd700 100%);touch-action:none}
        #gameCanvas{display:block;width:100%;height:100%}
        .overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);color:white;z-index:10}
        .title{font-size:clamp(28px,7vw,48px);background:linear-gradient(180deg,#FFD700 0%,#FF6B35 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;animation:glow 2s ease-in-out infinite alternate}
        .jets-preview{display:flex;gap:15px;margin:20px 0;animation:float 3s ease-in-out infinite}
        .jet-icon{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.3))}
        .tap-hint{font-size:clamp(16px,4vw,24px);color:#87CEEB;animation:pulse 1.5s infinite}
        #endScreen{display:none}
        .collection{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}
        .collected{font-size:36px;animation:pop 0.3s ease-out}
        .cta-btn{background:linear-gradient(180deg,#9b59b6 0%,#8e44ad 100%);color:white;border:none;padding:18px 50px;font-size:clamp(16px,4vw,24px);font-weight:bold;border-radius:50px;cursor:pointer;box-shadow:0 8px 0 #6c3483,0 15px 20px rgba(0,0,0,0.3);margin-top:20px;animation:bounce 1s infinite}
        #scoreDisplay{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-size:clamp(32px,8vw,48px);color:white;text-shadow:3px 3px 0 #000;z-index:5}
        #jetsCollected{position:absolute;top:15px;right:15px;font-size:18px;color:#FFD700;z-index:5;background:rgba(0,0,0,0.5);padding:8px 15px;border-radius:20px}
        @keyframes glow{from{filter:drop-shadow(0 0 10px #FFD700)}to{filter:drop-shadow(0 0 20px #FF6B35)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes pop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="scoreDisplay" style="display:none">0</div>
    <div id="jetsCollected" style="display:none">✈️ <span id="jetCount">0</span>/5</div>
    <div id="startScreen" class="overlay">
        <div class="title">✈️ COLLECT JETS!</div>
        <div class="jets-preview">
            <span class="jet-icon">🛩️</span>
            <span class="jet-icon">✈️</span>
            <span class="jet-icon">🚀</span>
            <span class="jet-icon">🛸</span>
        </div>
        <div style="font-size:14px;color:#FFD700;margin:10px 0">30+ Unique Jets to Unlock!</div>
        <div class="tap-hint">👆 TAP TO START</div>
    </div>
    <div id="endScreen" class="overlay">
        <div class="title">🏆 JETS COLLECTED!</div>
        <div class="collection" id="collectionDisplay"></div>
        <div style="font-size:24px;color:#FFD700;margin:10px 0">Score: <span id="finalScore">0</span></div>
        <div style="font-size:14px;color:#87CEEB">Unlock ALL 30+ jets in the full game!</div>
        <button class="cta-btn" id="installBtn">GET ALL JETS FREE</button>
    </div>

        if(typeof mraid!=='undefined'&&mraid.getState()==='loading'){mraid.addEventListener('ready',()=>mraidReady=true)}

        const jetColors=['#4A90E2','#E74C3C','#2ECC71','#9B59B6','#F39C12'];

        let jetLoaded=false;jetImg.onload=()=>{jetLoaded=true};
        
        let gameStarted=false,gameOver=false,score=0,collectedJets=[],frame=0;
        const player={x:0,y:0,w:60,h:45,vel:0,grav:0.4,jump:-9,color:'#4A90E2'};
        function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;player.x=canvas.width*0.2;if(!gameStarted)player.y=canvas.height/2}
        resize();window.addEventListener('resize',resize);
        const obstacles=[],collectibles=[];
        function createObs(){const gap=210,min=50,max=canvas.height-gap-min,top=Math.random()*(max-min)+min;obstacles.push({x:canvas.width,top,bot:top+gap,passed:false})}
        function createJetCollectible(){if(collectibles.length<3&&collectedJets.length<5){const jet=jetEmojis[Math.floor(Math.random()*jetEmojis.length)];collectibles.push({x:canvas.width+50,y:Math.random()*(canvas.height-200)+100,jet,collected:false})}}
        function drawPlayer(){ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.rotate(Math.min(Math.max(player.vel*0.04,-0.4),0.6));
            if(jetLoaded){ctx.drawImage(jetImg,-player.w/2,-player.h/2,player.w,player.h)}
            else{const g=ctx.createLinearGradient(-player.w/2,0,player.w/2,0);g.addColorStop(0,player.color);g.addColorStop(1,'#2C3E50');ctx.fillStyle=g;
            ctx.beginPath();ctx.moveTo(-player.w/2,0);ctx.lineTo(player.w/2,-player.h/2);ctx.lineTo(player.w/2,player.h/2);ctx.closePath();ctx.fill();
            ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.ellipse(player.w/4,-player.h/6,6,4,0,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#FF6B6B';ctx.fillRect(-player.w/2-8,-2,12,4)}ctx.restore()}
        function drawObs(){obstacles.forEach(o=>{ctx.fillStyle='#8B4513';ctx.fillRect(o.x,0,70,o.top);ctx.fillRect(o.x,o.bot,70,canvas.height-o.bot);
            ctx.fillStyle='#654321';ctx.fillRect(o.x-5,o.top-15,80,15);ctx.fillRect(o.x-5,o.bot,80,15)})}
        function drawCollectibles(){collectibles.forEach(c=>{if(!c.collected){ctx.font='36px Arial';ctx.fillText(c.jet,c.x,c.y);ctx.fillStyle='rgba(255,215,0,0.3)';ctx.beginPath();ctx.arc(c.x+18,c.y-10,25,0,Math.PI*2);ctx.fill()}})}
        function drawBg(){const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#ff6b35');g.addColorStop(0.5,'#f7931e');g.addColorStop(1,'#ffd700');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='rgba(255,255,255,0.2)';for(let i=0;i<30;i++){const x=(frame*0.3+i*80)%canvas.width,y=Math.sin(i*0.5+frame*0.02)*50+canvas.height*0.3;ctx.beginPath();ctx.ellipse(x,y,40,20,0,0,Math.PI*2);ctx.fill()}}
        function update(){if(!gameStarted||gameOver)return;frame++;
            player.vel+=player.grav;player.y+=player.vel;
            if(frame%90===0)createObs();if(frame%120===0)createJetCollectible();
            obstacles.forEach((o,i)=>{o.x-=4;if(!o.passed&&o.x+70<player.x){o.passed=true;score+=10;document.getElementById('scoreDisplay').textContent=score}
                if(o.x+70<0)obstacles.splice(i,1);if(player.x+player.w>o.x&&player.x<o.x+70&&(player.y<o.top||player.y+player.h>o.bot))endGame()});
            collectibles.forEach((c,i)=>{c.x-=4;if(!c.collected&&Math.abs(player.x-c.x)<40&&Math.abs(player.y-c.y)<40){c.collected=true;collectedJets.push(c.jet);score+=50;document.getElementById('scoreDisplay').textContent=score;document.getElementById('jetCount').textContent=collectedJets.length;player.color=jetColors[collectedJets.length%jetColors.length]}
                if(c.x<-50)collectibles.splice(i,1)});
            if(player.y+player.h>canvas.height||player.y<0)endGame();if(collectedJets.length>=5)endGame()}
        function draw(){drawBg();drawObs();drawCollectibles();drawPlayer()}
        function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
        function startGame(){gameStarted=true;document.getElementById('startScreen').style.display='none';document.getElementById('scoreDisplay').style.display='block';document.getElementById('jetsCollected').style.display='block';player.vel=player.jump}
        function endGame(){if(gameOver)return;gameOver=true;document.getElementById('finalScore').textContent=score;
            const display=document.getElementById('collectionDisplay');display.innerHTML=collectedJets.map(j=>`<span class="collected">${j}</span>`).join('');
            document.getElementById('endScreen').style.display='flex'}
        function jump(){if(!gameStarted)startGame();else if(!gameOver)player.vel=player.jump}
        const startScreenEl=document.getElementById('startScreen');
        document.body.addEventListener('click',jump);document.body.addEventListener('touchstart',e=>{e.preventDefault();jump()});
        startScreenEl.addEventListener('click',jump);startScreenEl.addEventListener('touchstart',e=>{e.preventDefault();jump()});
        document.getElementById('installBtn').addEventListener('click',e=>{e.stopPropagation();
            const url='https://play.google.com/store/apps/details?id=com.flappyjet.pro.flappy_jet_pro';
            if(typeof mraid!=='undefined'&&mraidReady)mraid.open(url);else window.open(url,'_blank')});
        gameLoop();
    </script>
</body>
</html>
