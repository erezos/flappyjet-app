<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="ad.size" content="width=320,height=480">
    <title>FlappyJet - Boss Battle!</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{width:100%;height:100vh;overflow:hidden;font-family:'Arial Black',sans-serif;background:#000;touch-action:none}
        #gameCanvas{display:block;width:100%;height:100%}
        .overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);color:white;z-index:10}
        .title{font-size:clamp(26px,7vw,44px);color:#FF4444;text-shadow:0 0 20px #FF0000;margin-bottom:10px;animation:pulse 1s infinite}
        .vs-text{font-size:clamp(40px,12vw,72px);color:#FFD700;text-shadow:0 0 30px #FFA500;margin:15px 0;animation:shake 0.5s infinite}
        .boss-preview{font-size:60px;animation:float 2s ease-in-out infinite}
        .tap-hint{font-size:clamp(14px,4vw,20px);color:#87CEEB;margin-top:20px;animation:blink 1s infinite}
        #endScreen{display:none}
        .result{font-size:clamp(32px,8vw,48px);margin-bottom:10px}
        .damage-dealt{font-size:20px;color:#FF6B6B;margin:10px 0}
        .cta-btn{background:linear-gradient(180deg,#E74C3C 0%,#C0392B 100%);color:white;border:none;padding:18px 50px;font-size:clamp(16px,4vw,24px);font-weight:bold;border-radius:50px;cursor:pointer;box-shadow:0 8px 0 #922B21,0 15px 20px rgba(0,0,0,0.3);margin-top:20px;animation:bounce 1s infinite}
        #hud{position:absolute;top:0;left:0;width:100%;padding:15px;z-index:5;display:none}
        .health-bar{height:20px;background:#333;border-radius:10px;overflow:hidden;margin-bottom:8px}
        .health-fill{height:100%;transition:width 0.3s}
        .player-health .health-fill{background:linear-gradient(90deg,#2ECC71,#27AE60)}
        .boss-health .health-fill{background:linear-gradient(90deg,#E74C3C,#C0392B)}
        .health-label{font-size:12px;color:white;margin-bottom:3px}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div class="health-label">YOU</div>
        <div class="health-bar player-health"><div class="health-fill" id="playerHealth" style="width:100%"></div></div>
        <div class="health-label" style="text-align:right">BOSS 👿</div>
        <div class="health-bar boss-health"><div class="health-fill" id="bossHealth" style="width:100%"></div></div>
    </div>
    <div id="startScreen" class="overlay">
        <div class="title">⚔️ BOSS BATTLE!</div>
        <div class="vs-text">VS</div>
        <div class="boss-preview">👿</div>
        <div style="font-size:16px;color:#FF6B6B;margin:10px 0">Defeat the Boss!</div>
        <div class="tap-hint">👆 TAP TO FIGHT</div>
    </div>
    <div id="endScreen" class="overlay">
        <div class="result" id="resultText">🎉 VICTORY!</div>
        <div class="damage-dealt">Damage Dealt: <span id="damageDealt">0</span></div>
        <div style="font-size:14px;color:#87CEEB;margin:10px 0">10 Epic Boss Battles Await!</div>
        <button class="cta-btn" id="installBtn">FIGHT MORE BOSSES</button>
    </div>

        let jetLoaded=false;jetImg.onload=()=>{jetLoaded=true};
        
        let gameStarted=false,gameOver=false,frame=0,damage=0;
        const player={x:0,y:0,w:60,h:45,vel:0,grav:0.35,jump:-8,health:100};
        const boss={x:0,y:0,w:70,h:50,health:100,phase:0,attackTimer:0};
        function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;player.x=canvas.width*0.15;boss.x=canvas.width*0.7;if(!gameStarted){player.y=canvas.height/2;boss.y=canvas.height/2}}
        resize();window.addEventListener('resize',resize);
        const bullets=[],bossBullets=[];
        function drawPlayer(){ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);
            if(jetLoaded){ctx.drawImage(jetImg,-player.w/2,-player.h/2,player.w,player.h)}
            else{const g=ctx.createLinearGradient(-player.w/2,0,player.w/2,0);g.addColorStop(0,'#3498DB');g.addColorStop(1,'#2980B9');ctx.fillStyle=g;
            ctx.beginPath();ctx.moveTo(-player.w/2,0);ctx.lineTo(player.w/2,-player.h/2);ctx.lineTo(player.w/2,player.h/2);ctx.closePath();ctx.fill();
            ctx.fillStyle='#ECF0F1';ctx.beginPath();ctx.ellipse(player.w/4,-player.h/6,6,4,0,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#F39C12';ctx.fillRect(-player.w/2-10,-3,15,6)}ctx.restore()}
        function drawBoss(){ctx.save();ctx.translate(boss.x+boss.w/2,boss.y+boss.h/2);
            const pulse=Math.sin(frame*0.1)*5;ctx.shadowColor='#E74C3C';ctx.shadowBlur=20+pulse;
            ctx.scale(-1,1);// Flip horizontally to face left
            if(jetLoaded){
                // Draw boss using same jet but with color filter to make it red/orange
                ctx.filter='hue-rotate(320deg) saturate(1.5) brightness(1.1)';
                ctx.drawImage(jetImg,-boss.w/2,-boss.h/2,boss.w,boss.h);
                ctx.filter='none';
            }else{const g=ctx.createLinearGradient(-boss.w/2,0,boss.w/2,0);g.addColorStop(0,'#C0392B');g.addColorStop(1,'#E74C3C');ctx.fillStyle=g;
            ctx.beginPath();ctx.moveTo(boss.w/2,0);ctx.lineTo(-boss.w/2,-boss.h/2);ctx.lineTo(-boss.w/2,boss.h/2);ctx.closePath();ctx.fill()}
            ctx.restore()}
        function drawBullets(){ctx.fillStyle='#3498DB';bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill()});
            ctx.fillStyle='#E74C3C';bossBullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill()})}
        function drawBg(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.strokeStyle='rgba(231,76,60,0.1)';ctx.lineWidth=1;for(let i=0;i<canvas.width;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
            for(let i=0;i<canvas.height;i+=50){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke()}
            for(let i=0;i<20;i++){ctx.fillStyle=`rgba(231,76,60,${Math.random()*0.3})`;ctx.beginPath();ctx.arc(Math.random()*canvas.width,Math.random()*canvas.height,Math.random()*3,0,Math.PI*2);ctx.fill()}}
        function shoot(){bullets.push({x:player.x+player.w,y:player.y+player.h/2,vx:10})}
        function bossShoot(){const angle=Math.atan2(player.y-boss.y,player.x-boss.x);bossBullets.push({x:boss.x,y:boss.y+boss.h/2,vx:Math.cos(angle)*6,vy:Math.sin(angle)*6})}
        function update(){if(!gameStarted||gameOver)return;frame++;
            player.vel+=player.grav;player.y+=player.vel;player.y=Math.max(0,Math.min(canvas.height-player.h,player.y));
            boss.y=canvas.height/2+Math.sin(frame*0.03)*100;boss.attackTimer++;
            if(boss.attackTimer>60){bossShoot();boss.attackTimer=0}
            if(frame%15===0)shoot();
            bullets.forEach((b,i)=>{b.x+=b.vx;if(b.x>canvas.width)bullets.splice(i,1);
                if(b.x>boss.x&&b.x<boss.x+boss.w&&b.y>boss.y&&b.y<boss.y+boss.h){bullets.splice(i,1);boss.health-=5;damage+=5;document.getElementById('bossHealth').style.width=boss.health+'%'}});
            bossBullets.forEach((b,i)=>{b.x+=b.vx;b.y+=b.vy;if(b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height)bossBullets.splice(i,1);
                if(Math.abs(b.x-player.x-player.w/2)<30&&Math.abs(b.y-player.y-player.h/2)<30){bossBullets.splice(i,1);player.health-=10;document.getElementById('playerHealth').style.width=player.health+'%'}});
            if(boss.health<=0)endGame(true);if(player.health<=0)endGame(false)}
        function draw(){drawBg();drawBullets();drawPlayer();drawBoss()}
        function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
        function startGame(){gameStarted=true;document.getElementById('startScreen').style.display='none';document.getElementById('hud').style.display='block'}
        function endGame(won){if(gameOver)return;gameOver=true;document.getElementById('resultText').textContent=won?'🎉 VICTORY!':'💀 DEFEATED';document.getElementById('damageDealt').textContent=damage;document.getElementById('endScreen').style.display='flex'}
        function jump(){if(!gameStarted)startGame();else if(!gameOver)player.vel=player.jump}
        const startScreenEl=document.getElementById('startScreen');
        document.body.addEventListener('click',jump);document.body.addEventListener('touchstart',e=>{e.preventDefault();jump()});
        startScreenEl.addEventListener('click',jump);startScreenEl.addEventListener('touchstart',e=>{e.preventDefault();jump()});
        document.getElementById('installBtn').addEventListener('click',e=>{e.stopPropagation();
            const url='https://play.google.com/store/apps/details?id=com.flappyjet.pro.flappy_jet_pro';
            if(typeof mraid!=='undefined'&&mraidReady)mraid.open(url);else window.open(url,'_blank')});
        gameLoop();
    </script>
</body>
</html>
