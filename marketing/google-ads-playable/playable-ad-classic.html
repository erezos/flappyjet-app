<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="ad.size" content="width=320,height=480">
    <title>FlappyJet - Tap to Play!</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{width:100%;height:100vh;overflow:hidden;font-family:'Arial Black',sans-serif;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);touch-action:none}
        #gameCanvas{display:block;width:100%;height:100%;cursor:pointer}
        .overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);color:white;z-index:10}
        .title{font-size:clamp(32px,8vw,56px);background:linear-gradient(180deg,#FFD700 0%,#FFA500 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:3px 3px 6px rgba(0,0,0,0.5);margin-bottom:10px;animation:float 2s ease-in-out infinite}
        .subtitle{font-size:clamp(14px,4vw,24px);color:#87CEEB;margin-bottom:30px}
        .tap-hint{font-size:clamp(18px,5vw,28px);color:#fff;animation:pulse 1.5s infinite}
        #endScreen{display:none}
        .score-display{font-size:clamp(36px,10vw,64px);color:#FFD700;margin:20px 0}
        .cta-btn{background:linear-gradient(180deg,#4CAF50 0%,#2E7D32 100%);color:white;border:none;padding:18px 50px;font-size:clamp(18px,5vw,28px);font-weight:bold;border-radius:50px;cursor:pointer;box-shadow:0 8px 0 #1B5E20,0 15px 20px rgba(0,0,0,0.3);margin-top:20px;animation:bounce 1s infinite;text-transform:uppercase}
        .cta-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #1B5E20}
        #scoreDisplay{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:clamp(36px,10vw,56px);color:white;text-shadow:3px 3px 0 #000;z-index:5}
        #gemCount{position:absolute;top:20px;right:20px;font-size:20px;color:#FFD700;z-index:5;display:flex;align-items:center;gap:8px}
        .stars{display:flex;gap:10px;margin:15px 0}
        .star{font-size:32px;animation:starPop 0.3s ease-out forwards;opacity:0}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        @keyframes starPop{to{opacity:1;transform:scale(1.2)}}
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="scoreDisplay" style="display:none">0</div>
    <div id="gemCount" style="display:none">💎 <span id="gems">0</span></div>
    <div id="startScreen" class="overlay">
        <div class="title">✈️ FLAPPY JET</div>
        <div class="subtitle">50 Levels • Boss Battles • Tournaments</div>
        <div class="tap-hint">👆 TAP TO FLY!</div>
    </div>
    <div id="endScreen" class="overlay">
        <div class="title">🎉 AWESOME!</div>
        <div class="stars"><span class="star" style="animation-delay:0.1s">⭐</span><span class="star" style="animation-delay:0.2s">⭐</span><span class="star" style="animation-delay:0.3s">⭐</span></div>
        <div class="score-display">Score: <span id="finalScore">0</span></div>
        <div style="font-size:16px;color:#87CEEB;margin:10px 0">Unlock 30+ jets & 5 epic zones!</div>
        <button class="cta-btn" id="installBtn">DOWNLOAD FREE</button>
    </div>

        const scoreDisplay=document.getElementById('scoreDisplay'),gemCountEl=document.getElementById('gemCount');

        let jetLoaded=false;jetImg.onload=()=>{jetLoaded=true};
        
        let gameStarted=false,gameOver=false,score=0,gems=0,frame=0;
        const jet={x:0,y:0,w:70,h:50,vel:0,grav:0.45,jump:-9,rot:0};
        function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;jet.x=canvas.width*0.2;if(!gameStarted)jet.y=canvas.height/2}
        resize();window.addEventListener('resize',resize);
        const obstacles=[],obstW=80,obstGap=220,obstSpeed=3;
        const gemItems=[];
        function createObs(){const min=60,max=canvas.height-obstGap-min,top=Math.random()*(max-min)+min;obstacles.push({x:canvas.width,top,bot:top+obstGap,passed:false})}
        function createGem(){if(Math.random()<0.3){const y=Math.random()*(canvas.height-200)+100;gemItems.push({x:canvas.width+100,y,collected:false})}}
        function drawJet(){ctx.save();ctx.translate(jet.x+jet.w/2,jet.y+jet.h/2);ctx.rotate(jet.rot);
            if(jetLoaded){ctx.drawImage(jetImg,-jet.w/2,-jet.h/2,jet.w,jet.h)}
            else{const g=ctx.createLinearGradient(-jet.w/2,0,jet.w/2,0);g.addColorStop(0,'#4A90E2');g.addColorStop(1,'#2E5C8A');ctx.fillStyle=g;
            ctx.beginPath();ctx.moveTo(-jet.w/2,0);ctx.lineTo(jet.w/2,-jet.h/2);ctx.lineTo(jet.w/2,jet.h/2);ctx.closePath();ctx.fill();
            ctx.fillStyle='#87CEEB';ctx.beginPath();ctx.ellipse(jet.w/4,-jet.h/6,8,5,0,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#FF6B6B';ctx.fillRect(-jet.w/2-10,-3,15,6)}
            ctx.restore()}
        function drawObs(){obstacles.forEach(o=>{const g1=ctx.createLinearGradient(o.x,0,o.x+obstW,0);g1.addColorStop(0,'#2ECC71');g1.addColorStop(1,'#27AE60');
            ctx.fillStyle=g1;ctx.fillRect(o.x,0,obstW,o.top);ctx.fillRect(o.x,o.bot,obstW,canvas.height-o.bot);
            ctx.fillStyle='#1E8449';ctx.fillRect(o.x-5,o.top-20,obstW+10,20);ctx.fillRect(o.x-5,o.bot,obstW+10,20)})}
        function drawGems(){gemItems.forEach(g=>{if(!g.collected){ctx.font='24px Arial';ctx.fillText('💎',g.x,g.y)}})}
        function drawBg(){const g=ctx.createLinearGradient(0,0,0,canvas.height);g.addColorStop(0,'#1a1a2e');g.addColorStop(0.5,'#16213e');g.addColorStop(1,'#0f3460');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='rgba(255,255,255,0.1)';for(let i=0;i<50;i++){ctx.beginPath();ctx.arc((frame*0.5+i*100)%canvas.width,Math.sin(i)*100+canvas.height/3,2,0,Math.PI*2);ctx.fill()}}
        function update(){if(!gameStarted||gameOver)return;frame++;
            jet.vel+=jet.grav;jet.y+=jet.vel;jet.rot=Math.min(Math.max(jet.vel*0.04,-0.4),0.6);
            if(frame%100===0)createObs();if(frame%150===0)createGem();
            obstacles.forEach((o,i)=>{o.x-=obstSpeed;if(!o.passed&&o.x+obstW<jet.x){o.passed=true;score++;scoreDisplay.textContent=score}
                if(o.x+obstW<0)obstacles.splice(i,1);
                if(jet.x+jet.w>o.x&&jet.x<o.x+obstW&&(jet.y<o.top||jet.y+jet.h>o.bot))endGame()});
            gemItems.forEach((g,i)=>{g.x-=obstSpeed;if(!g.collected&&Math.abs(jet.x-g.x)<30&&Math.abs(jet.y-g.y)<30){g.collected=true;gems++;document.getElementById('gems').textContent=gems}
                if(g.x<-50)gemItems.splice(i,1)});
            if(jet.y+jet.h>canvas.height||jet.y<0)endGame()}
        function draw(){drawBg();drawObs();drawGems();drawJet()}
        function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
        function startGame(){gameStarted=true;startScreen.style.display='none';scoreDisplay.style.display='block';gemCountEl.style.display='flex';jet.vel=jet.jump}
        function endGame(){if(gameOver)return;gameOver=true;document.getElementById('finalScore').textContent=score;endScreen.style.display='flex'}
        function jump(){if(!gameStarted)startGame();else if(!gameOver)jet.vel=jet.jump}
        document.body.addEventListener('click',jump);
        document.body.addEventListener('touchstart',e=>{e.preventDefault();jump()});
        startScreen.addEventListener('click',jump);
        startScreen.addEventListener('touchstart',e=>{e.preventDefault();jump()});
        document.getElementById('installBtn').addEventListener('click',e=>{e.stopPropagation();
            const url='https://play.google.com/store/apps/details?id=com.flappyjet.pro.flappy_jet_pro';
            if(typeof mraid!=='undefined'&&mraidReady)mraid.open(url);else window.open(url,'_blank')});
        gameLoop();
    </script>
</body>
</html>
